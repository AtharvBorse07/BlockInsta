<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Infinite Reels blocked - BlockInsta</title>
    <link rel="stylesheet" href="blocked.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="block-card" aria-labelledby="page-title">
        <img class="app-icon" src="../icons/icon-128.png" width="82" height="82" alt="">
        <p class="eyebrow">BlockInsta</p>
        <h1 id="page-title">Infinite Reels are blocked</h1>
        <p id="page-message" class="message">
          The endless Reels viewer is off limits. Messages, posts, profiles,
          and individual Reels are still available.
        </p>

        <div class="action-grid">
          <button id="back-button" class="primary-button" type="button">Go back</button>
          <a id="messages-link" class="secondary-button" href="https://www.instagram.com/direct/inbox/">Open Messages</a>
          <a id="following-link" class="secondary-button" href="https://www.instagram.com/?variant=following">Open Following</a>
          <a id="home-link" class="text-button" href="https://www.instagram.com/">Open Instagram home</a>
        </div>

        <p id="action-note" class="action-note" aria-live="polite"></p>
      </section>
      <p class="scope-note">BlockInsta changes the website in this browser, not the Instagram app.</p>
    </main>

    <script src="blocked.js"></script>
  </body>
</html>
